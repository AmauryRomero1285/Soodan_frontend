<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verificación de cuenta - Soodan</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50;">¡Bienvenido a Soodan!</h2>
        <p>Hola <strong>{{ name }}</strong>,</p>
        <p>Gracias por registrarte en nuestra plataforma médica.</p>
        <p>Tu código de verificación es:</p>
        <h1 style="font-size: 32px; letter-spacing: 8px; color: #3498db; text-align: center; background: #f8f9fa; padding: 20px; border-radius: 8px;">
            {{ code }}
        </h1>
        <p><strong>Este código expira en 10 minutos.</strong></p>
        <p>Si no solicitaste este registro, ignora este correo.</p>
        <hr>
        <p style="font-size: 12px; color: #777;">Equipo Soodan - App Médica</p>
    </div>
</body>
</html>
