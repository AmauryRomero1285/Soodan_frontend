<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recuperación de contraseña - Soodan</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #e74c3c;">Recuperación de Contraseña</h2>
        <p>Hola,</p>
        <p>Recibimos una solicitud para restablecer tu contraseña.</p>
        <p>Tu código de recuperación es:</p>
        <h1 style="font-size: 32px; letter-spacing: 8px; color: #e74c3c; text-align: center; background: #f8f9fa; padding: 20px; border-radius: 8px;">
            {{ code }}
        </h1>
        <p><strong>Este código expira en 10 minutos.</strong></p>
        <p>Si no solicitaste este cambio, ignora este correo.</p>
        <hr>
        <p style="font-size: 12px; color: #777;">Equipo Soodan</p>
    </div>
</body>
</html>
